services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - /etc/riklab-report.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/lib/riklab-report:/var/lib/riklab-service
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login.html').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
